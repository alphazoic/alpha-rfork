name: rfork live MEGA
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform or upload correctness gate to validate
        type: choice
        default: all
        options:
          - all
          - windows
          - darwin
          - protocol
          - improvements
permissions:
  contents: read
concurrency:
  group: rfork-live-mega-account
  cancel-in-progress: false
jobs:
  live:
    if: inputs.platform != 'protocol' && inputs.platform != 'improvements'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ inputs.platform == 'all' && fromJSON('["windows","darwin"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-latest' || 'macos-15-intel' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build native rfork and pristine stock verifier
        run: |
          bin/build-rfork '${{ matrix.target }}' amd64
          bin/build-stock
          if [[ '${{ matrix.target }}' == windows ]]; then
            mv build/rclone-v1.75.2-stock build/rclone-v1.75.2-stock.exe
          fi
      - name: Live uploads, integrity, replacement and cancellation
        env:
          RFORK_MEGA_EMAIL: ${{ secrets.RFORK_MEGA_EMAIL }}
          RFORK_MEGA_PASSWORD: ${{ secrets.RFORK_MEGA_PASSWORD }}
        run: python bin/live-mega.py run --target '${{ matrix.target }}'
      - name: Retry cleanup if the test step was interrupted
        if: always()
        env:
          RFORK_MEGA_EMAIL: ${{ secrets.RFORK_MEGA_EMAIL }}
          RFORK_MEGA_PASSWORD: ${{ secrets.RFORK_MEGA_PASSWORD }}
        run: python bin/live-mega.py cleanup --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rfork-live-mega-${{ matrix.target }}-amd64
          path: |
            build/live-mega-${{ matrix.target }}.json
            build/rfork-${{ matrix.target }}-amd64*
          if-no-files-found: warn
  improvements:
    if: inputs.platform == 'improvements'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-15-intel
            target: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build native candidate and pristine stock verifier
        run: |
          bin/build-rfork '${{ matrix.target }}' amd64
          bin/build-stock
          if [[ '${{ matrix.target }}' == windows ]]; then
            mv build/rclone-v1.75.2-stock build/rclone-v1.75.2-stock.exe
          fi
      - name: Verify configurable uploads and cancellation
        env:
          RFORK_MEGA_EMAIL: ${{ secrets.RFORK_MEGA_EMAIL }}
          RFORK_MEGA_PASSWORD: ${{ secrets.RFORK_MEGA_PASSWORD }}
        run: python bin/live-upload-improvements.py run --target '${{ matrix.target }}'
      - name: Retry scoped cleanup
        if: always()
        env:
          RFORK_MEGA_EMAIL: ${{ secrets.RFORK_MEGA_EMAIL }}
          RFORK_MEGA_PASSWORD: ${{ secrets.RFORK_MEGA_PASSWORD }}
        run: python bin/live-upload-improvements.py cleanup --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rfork-upload-improvements-${{ matrix.target }}
          path: |
            build/upload-improvements-live-${{ matrix.target }}.json
            build/rfork-${{ matrix.target }}-amd64*
          if-no-files-found: warn
  protocol:
    if: inputs.platform == 'protocol'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: false
      - name: Build pristine independent verifier
        run: bin/build-stock
      - name: Probe batching and offset replay
        env:
          RFORK_MEGA_EMAIL: ${{ secrets.RFORK_MEGA_EMAIL }}
          RFORK_MEGA_PASSWORD: ${{ secrets.RFORK_MEGA_PASSWORD }}
        run: python3 bin/probe-upload-protocol.py run
      - name: Verify scoped cleanup
        if: always()
        env:
          RFORK_MEGA_EMAIL: ${{ secrets.RFORK_MEGA_EMAIL }}
          RFORK_MEGA_PASSWORD: ${{ secrets.RFORK_MEGA_PASSWORD }}
        run: python3 bin/probe-upload-protocol.py cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rfork-upload-protocol
          path: build/upload-protocol.json
          if-no-files-found: warn
