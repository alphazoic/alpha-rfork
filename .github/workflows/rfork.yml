name: rfork checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      checkpoint_only:
        description: Run focused checkpoint/backend native checks without repeating the upstream suite
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-15-intel
            target: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: false
      - name: Install Linux NFS test helper
        if: matrix.target == 'linux' && !inputs.checkpoint_only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nfs-common
      - name: Build Linux upstream integration-test executable
        if: matrix.target == 'linux' && !inputs.checkpoint_only
        run: |
          mkdir -p build/test-bin
          bin/rfork-go build -mod=readonly -o build/test-bin/rclone .
          echo "$PWD/build/test-bin" >> "$GITHUB_PATH"
      - name: Upload worker races
        run: RCLONE_CONFIG=/notfound bin/rfork-go test -race -timeout 5m ./backend/mega -run '^TestUpload'
      - name: Dependency races and crypto fixtures
        run: RFORK_WORKDIR="$PWD/deps/go-mega" bin/rfork-go test -race -timeout 5m ./...
      - name: Offline live-runner cleanup and diagnostic fixtures
        run: |
          python bin/test_probe_upload_protocol.py
          python bin/test_live_upload_improvements.py
      - name: Upstream unit tests
        if: '!inputs.checkpoint_only'
        run: RCLONE_CONFIG=/notfound bin/rfork-go test -timeout 20m ./...
      - name: Lint changed packages
        if: matrix.target == 'linux'
        run: |
          python3 bin/fetch-lint.py
          bin/lint-rfork
      - name: Build native CLI
        run: bin/build-rfork '${{ matrix.target }}' amd64
      - name: CLI smoke
        run: |
          binary="build/rfork-${{ matrix.target }}-amd64"
          if [[ '${{ matrix.target }}' == windows ]]; then binary="$binary.exe"; fi
          "$binary" version
          "$binary" help backend mega
          mkdir -p build/local-smoke
          printf 'rfork native smoke\n' > build/local-smoke/source
          "$binary" copyto build/local-smoke/source build/local-smoke/target
          cmp build/local-smoke/source build/local-smoke/target
      - uses: actions/upload-artifact@v7
        with:
          name: rfork-${{ matrix.target }}-amd64
          path: build/rfork-${{ matrix.target }}-amd64*
          if-no-files-found: error
